<svg xmlns="http://www.w3.org/2000/svg" width="408" height="212" viewBox="0 0 408 212" role="img" aria-label="Open for new projects. Click to email me.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}
.s{fill:#59636e}.m{fill:#6e7781}.b{font-weight:600}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .7s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="407" height="211" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<circle class="pulse" cx="25" cy="31" r="5" fill="#0ca30c"/>
<circle cx="25" cy="31" r="5" fill="#0ca30c"/>
<text x="38" y="36" font-size="17" class="b">Open for new projects</text>
<text x="20" y="57" font-size="12" class="m">Freelance · Kolkata, India · IST (UTC+5:30)</text>
<text x="20" y="82" font-size="13" class="s">If your business runs on spreadsheets, paper registers</text>
<text x="20" y="100" font-size="13" class="s">or software that only half fits, I can build the system</text>
<text x="20" y="118" font-size="13" class="s">it actually needs.</text>
<line x1="20" x2="388" y1="160" y2="160" stroke="#e6e8eb"/>
<text x="20" y="182" font-size="13" class="b">Start a conversation</text>
<text x="20" y="198" font-size="11" class="m">Click this card to email me</text>
</svg>
